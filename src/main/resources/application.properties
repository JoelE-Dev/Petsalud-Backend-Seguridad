spring.application.name=backendpetsalud
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Obligatoria: variable de entorno con clave aleatoria de al menos 32 bytes (43 caracteres base64).
petsalud.jwt.secret=${PETSALUD_JWT_SECRET:}
petsalud.jwt.expiration-ms=3600000
server.error.include-message=never
